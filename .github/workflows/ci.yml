name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source hygiene, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check repository contents
        run: npm run check:repo
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run contract and recovery tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Verify generated ABI and lockfile are reproducible
        run: git diff --exit-code -- src/generated/abi.ts package-lock.json
